[package]
name = "unlace"
version = "0.2.4"
edition = "2024"
rust-version = "1.89"
description = "Bounded streaming WebM/Matroska audio demuxing, verified seeking and encoded-block writing in pure Rust."
license = "MIT"
publish = false
repository = "https://github.com/ekhodzitsky/unlace"
readme = "README.md"
keywords = ["webm", "matroska", "ebml", "demuxer", "muxer"]
categories = ["multimedia", "parsing"]

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
