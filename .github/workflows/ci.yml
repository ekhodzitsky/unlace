name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Rust 1.89 source checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.89.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.89.0 fmt --all -- --check
      - name: Check Clippy
        run: cargo +1.89.0 clippy --offline --locked --all-targets -- -D warnings
      - name: Test debug profile
        run: cargo +1.89.0 test --offline --locked
      - name: Test release profile
        run: cargo +1.89.0 test --offline --locked --release
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +1.89.0 doc --offline --locked --no-deps
      - name: Audit dependencies
        run: python3 tools/check_dependencies.py
      - name: Verify local source package
        run: cargo +1.89.0 package --offline --locked
